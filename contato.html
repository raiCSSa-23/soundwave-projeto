<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundWave - Contato</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logotipo">
                <img class="logo" src="img/logo-branca.png">
                <h1 class="sdwv">SOUND<span>WAVE</span></h1>
            </div>
            <nav>
                <ul>
                    <li><a class="pag" href="index.html"><strong>Início</strong></a></li>
                    <li><a class="pag" href="detalhes.html"><strong>Detalhes</strong></a></li>
                    <li><a class="pag" href="contato.html"><strong>Contato</strong></a></li>
                </ul>
            </nav>
        </header>

        <div class="banner-contato">
            <img src="img/banner-contato.png">
        </div>

        <main>
            <div class="contato">
                <div class="contato-info">
                    <h2>Fale com a gente</h2>
                    <p><strong>E-mail:</strong> soundwaveoficial@gmail.com</p>
                    <p><strong>Local:</strong> Wave Park - São Paulo (SP)</p>
                    <p><strong>Atendimento:</strong> Segunda a sexta, das 9h às 18h</p>

                    <h3>Redes sociais</h3>
                    <div class="redes">
                        <a href="https://www.instagram.com/" target="_blank"><img class="icon" src="img/insta.png"></a></a>
                        <a href="https://www.tiktok.com/" target="_blank"><img class="icon" src="img/tiktok.png"></a></a>
                        <a href="https://www.youtube.com/" target="_blank"><img class="icon" src="img/youtube.png"></a>
                    </div>
                </div>

                <form id="formContato">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>

                    <label for="assunto">Assunto</label>
                    <input type="text" id="assunto" required>

                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" rows="6" required></textarea>

                    <button type="submit" class="botao">ENVIAR</button>

                    <p id="mensagemForm"></p>
                </form>
            </div>
        </main>

        <footer>
            <p>SoundWave - Projeto Escolar</p>
        </footer>
    </div>

    <script src="/js/script.js"></script>
</body>

</html>
